<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="填寫星澔文創影音製作詢價表單，提供影片類型、預算、時程與需求說明。" />
    <meta property="og:image" content="https://zeronsr2000-ai.github.io/starhao/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>詢價表單｜星澔文創</title>
    <link rel="canonical" href="https://zeronsr2000-ai.github.io/starhao/quote.html" />
    <script src="canonical-redirect.js?v=20260902-2"></script>
    <link rel="stylesheet" href="styles.css?v=20260903-11" />
  </head>
  <body data-page="quote">
    <div class="grain" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <header class="header">
      <a href="index.html" class="logo"><span class="logo-mark">S</span><div><span data-brand>星澔文創</span><small data-english>STARHORIZON CREATIVE</small></div></a>
      <nav class="nav" data-nav>
        <a href="index.html">首頁</a><a href="works.html">作品案例</a><a href="services.html">服務項目</a><a href="process.html">製作流程</a><a href="about.html">關於我們</a><a class="active" href="quote.html">詢價</a>
      </nav>
      <a class="top-cta" href="quote.html">取得報價</a>
      <button class="menu" type="button" aria-label="開啟選單" aria-expanded="false" data-menu>MENU</button>
    </header>
    <main>
      <section class="section quote">
        <div class="quote-card">
          <div>
            <p class="eyebrow" data-page-quoteEyebrow>Start A Project</p>
            <h1 data-page-quoteTitle>告訴我們你的影片需求。</h1>
            <p data-page-quoteLead>表單會收集足夠資訊，讓我們能初步判斷製作範圍、預算與時程。送出後會進入後台詢價管理。</p>
            <div class="contact-strip" data-contact-info></div>
          </div>
          <form class="form" data-inquiry-form>
            <label>姓名 / 稱呼<input name="name" type="text" required /></label>
            <label>公司 / 品牌名稱<input name="company" type="text" required /></label>
            <div class="grid-2">
              <label>電話<input name="phone" type="tel" /></label>
              <label>Email<input name="email" type="email" required /></label>
            </div>
            <label>LINE ID<input name="lineId" type="text" /></label>
            <label>影片類型
              <select name="videoType" data-video-type-options required></select>
            </label>
            <div class="grid-2">
              <label>預計影片支數<input name="videoCount" type="text" placeholder="例如：正片 1 支、短影音 6 支" /></label>
              <label>是否需要拍攝<select name="shooting" data-shooting-options></select></label>
            </div>
            <div class="grid-2">
              <label>拍攝地點<input name="location" type="text" placeholder="例如：台中、台北、公司辦公室" /></label>
              <label>預計上片時間<input name="deadline" type="text" placeholder="例如：2026/08 前" /></label>
            </div>
            <label>預算區間
              <select name="budget" data-budget-options required></select>
            </label>
            <label>補充需求<textarea name="message" required placeholder="請描述影片用途、參考風格、預計平台、目前素材狀況等。"></textarea></label>
            <button class="btn primary full" type="submit" data-page-quoteSubmitText>送出詢價</button>
            <div class="status" data-form-status></div>
          </form>
        </div>
      </section>
    </main>
    <footer><div><strong data-brand-footer>星澔文創</strong><p>Brand Film / Interview / Podcast / Social Cuts</p></div><a href="admin.html">後台登入</a></footer>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="data.js?v=20260903-3"></script>
    <script src="firebase-client.js?v=20260903-2"></script>
    <script src="site.js?v=20260903-8"></script>
  </body>
</html>
