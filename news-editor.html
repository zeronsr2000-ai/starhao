<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>最新消息管理｜星澔文創</title><link rel="stylesheet" href="news-editor-preview/style.css"><script defer src="purify.min.js"></script><script defer src="news-content.js?v=1"></script><script defer src="news-store.js?v=1"></script><script defer src="news-editor-preview/app.js?v=2"></script></head>
<body><main>
<section id="list"><div class="bar"><div><small>內容管理 / 最新消息</small><h1>文章列表</h1></div><button class="primary" id="new">新增文章</button></div><p class="note">拖曳文章可調整展示順序。</p><div id="rows"></div><button id="order" disabled>儲存排序</button> <button id="refresh">重新載入文章</button></section>
<section id="edit" hidden><button id="back">返回文章列表</button><h1 id="editHeading">編輯文章</h1><label>文章標題<input id="title" placeholder="輸入文章標題"></label><label>正文</label><div class="paper"><div class="tools" id="tools"><select aria-label="段落樣式" id="block"><option value="">段落樣式</option><option value="p">內文</option><option value="h2">小標題</option></select><select id="size" aria-label="字級"><option value="">字級</option><option>14</option><option>16</option><option>20</option><option>24</option><option>32</option></select><button data-cmd="bold">粗體</button><label class="color">文字顏色<input id="color" type="color"></label><button id="link">插入連結</button><button id="photo">插入圖片</button><button id="video">嵌入影片</button><button id="social">嵌入貼文</button><button data-cmd="insertUnorderedList">清單</button><button data-cmd="undo">復原</button><button data-cmd="redo">重做</button><button data-cmd="removeFormat">清除格式</button></div><div contenteditable="true" id="body" role="textbox" aria-label="文章正文" aria-multiline="true"></div></div>
<details><summary>文章設定</summary><div class="fields"><label>網址代號<input id="slug"></label><label>分類<input id="category"></label><label>發布日期<input type="date" id="date"></label><label>封面圖片網址<input type="url" id="cover"></label><label>上傳封面圖片<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>封面替代文字<input id="coverAlt"></label><label>文章摘要<textarea id="summary"></textarea></label><label>SEO 標題<input id="seo"></label><label>SEO 描述<textarea id="description"></textarea></label></div></details><div class="actions"><button id="hide">儲存為下架</button><button id="draft">儲存草稿</button><button id="preview">預覽</button><button id="publish" class="primary">發布文章</button></div></section>
<section id="view" hidden><button id="resume">返回編輯</button><article id="reader"></article></section><p role="status" id="status"></p></main>
<dialog id="dialog"><h2 id="dt"></h2><div id="dc"></div><p id="error" role="alert"></p><div class="actions"><button id="cancel">取消</button><button class="primary" id="ok">確定</button></div></dialog></body></html>
